[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai"
version = "0.1.0"
description = "Atlas AI - financial intelligence assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Atlas AI Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # HTTP API framework.
    "fastapi>=0.115.0",
    # ASGI server for FastAPI.
    "uvicorn[standard]>=0.30.0",
    # ORM and asynchronous database support.
    "sqlalchemy[asyncio]>=2.0.0",
    # Database schema migration tooling.
    "alembic>=1.13.0",
    # PostgreSQL async driver.
    "asyncpg>=0.27.0",
    # Data validation and settings models.
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Environment-variable loading.
    "python-dotenv>=1.0.0",
    # Async HTTP client for provider integrations.
    "httpx>=0.27.0",
    # Structured application logging.
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    # Test runner and async test support.
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Formatting, linting, import ordering, and static typing.
    "black>=24.8.0",
    "ruff>=0.6.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    # Git hook management.
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
managed = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "(^|/)(migrations)/"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["app"]
skip_glob = ["app/database/migrations/*"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unused_configs = true
exclude = ["app/database/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: isolated unit test",
    "integration: integration test",
]
